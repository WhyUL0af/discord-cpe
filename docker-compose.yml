name: cpe-bot

services:
  postgres:
    image: postgres:16-alpine
    container_name: cpe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: cpe_bot
    volumes:
      - cpe_postgres_data:/var/lib/postgresql/data
    # 【多專案環境關鍵】：完全不佔用主機的 5432 Port
    # Bot 與資料庫透過 Docker 專屬內部網路 (cpe-network) 連線，主機或其他專案的 5432 完全不會衝突！
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cpe_bot"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cpe-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  discord-bot:
    build: .
    container_name: cpe-discord-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - /etc/discord-cpe/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_password@postgres:5432/cpe_bot
    volumes:
      - .:/app
    networks:
      - cpe-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cpe-network:
    name: cpe-network
    driver: bridge

volumes:
  cpe_postgres_data:
    name: cpe_postgres_data
