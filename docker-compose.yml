services:
  postgres:
    image: postgres:16-alpine
    container_name: cpe-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: cpe_bot
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cpe_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  discord-bot:
    build: .
    container_name: cpe-discord-bot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres_password@postgres:5432/cpe_bot
    volumes:
      - .:/app

volumes:
  postgres_data:
